<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Bobbi Louyakis" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="That page could not be found on Bobbi Louyakis's portfolio."
    />
    <title>Page not found | Bobbi Louyakis</title>
    <link
      rel="icon"
      href="/portfolio/assets/icons/logo.png"
      type="image/png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Root-relative, not "../" — a 404 is served for any depth of missing
         path, so relative asset links would break on /projects/anything. -->
    <link rel="stylesheet" href="/portfolio/css/base.css?v=2" />
    <link rel="stylesheet" href="/portfolio/css/layout.css?v=2" />
    <link rel="stylesheet" href="/portfolio/css/components.css?v=2" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <a href="/portfolio/" class="back-link">← Back to portfolio</a>
        <h1>Page not found</h1>
        <p class="section-label">Error 404</p>
      </header>
      <main class="project-detail">
        <section>
          <h2>That page isn't here</h2>
          <p>
            The link may be out of date, or the address may have a typo. Nothing
            is broken on your end.
          </p>
          <div class="callout-actions">
            <a class="button primary" href="/portfolio/">Go to the homepage</a>
            <a class="button tertiary" href="/portfolio/#projects"
              >See the projects</a
            >
          </div>
        </section>
      </main>
      <footer class="site-footer">
        <p>© 2026 Bobbi Louyakis</p>
      </footer>
    </div>
  </body>
</html>
